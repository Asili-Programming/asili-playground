name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # The highlighter's word lists are generated from Asili's compiler, which changes on its own
  # schedule: check weekly against Asili's develop so drift shows up without a push here.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  word-lists:
    name: Highlighter word lists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out Asili
        uses: actions/checkout@v7
        with:
          repository: Asili-Programming/Asili
          ref: develop
          path: .asili

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .asili

      - name: Word lists match the compiler's
        working-directory: .asili
        env:
          ASILI_PLAYGROUND_DIR: ${{ github.workspace }}
        run: cargo test -p pata-core --test editor_word_lists

  samples:
    name: Sample manifest is generated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: samples/manifest.json matches the sample files
        run: python3 scripts/gen_samples.py --check

  # Tell the site to rebuild when the playground changes on main (site.yml listens for this).
  # Needs the SITE_DISPATCH_TOKEN secret (a token allowed to dispatch to the site repository);
  # without it the job is skipped and the site rebuilds on its weekly schedule instead.
  notify-site:
    name: Rebuild the site
    needs: word-lists
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
    steps:
      - name: Send repository_dispatch to the site
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN is not set: skipping. The site rebuilds on its weekly schedule."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Asili-Programming/asili-programming.github.io/dispatches \
            -d '{"event_type":"playground-changed"}'
