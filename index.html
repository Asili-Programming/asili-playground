<!doctype html>
<html lang="sw">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Uwanja wa kuchezea wa Asili: endesha programu za Asili kwenye kivinjari chako bila kusakinisha chochote." />
  <title>Asili — Uwanja wa Kuchezea</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Asili <span data-i18n="subtitle">Uwanja wa Kuchezea</span></h1>
    <div class="header-actions">
      <select id="sample-picker" data-i18n-title="sampleTitle" title="Chagua mfano"></select>
      <button id="run-btn" class="primary" data-i18n="run" disabled>▶ Endesha</button>
      <button id="stop-btn" class="danger" data-i18n="stop" hidden>■ Simamisha</button>
      <span id="status" class="status" role="status" aria-live="polite"></span>
      <a id="lugha-switch" class="switch" href="?lugha=en">English</a>
    </div>
  </header>

  <div id="notice" class="notice" role="alert" hidden></div>

  <main>
    <section id="editor-pane" aria-label="Msimbo">
      <div id="editor"></div>
    </section>
    <section id="output-pane" aria-label="Matokeo">
      <div class="output-header">
        <span data-i18n="output">Matokeo</span>
        <button id="clear-btn" data-i18n="clear" data-i18n-title="clearTitle" title="Futa matokeo">Futa</button>
      </div>
      <pre id="output"></pre>
    </section>
  </main>

  <footer>
    <span data-i18n="footer">Inaendesha Asili kwenye kivinjari chako. Msimbo wako hautumwi kwa seva yoyote.</span>
    <a href="https://github.com/Asili-Programming/Asili" target="_blank" rel="noopener">Asili-Programming/Asili</a>
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
